name: Build and deploy artifacts to Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:
  schedule:
    - cron: '0 15 * * *' # every day at 15:00 UTC

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Base Site
        uses: actions/checkout@v6
        with:
          path: base

      - name: Checkout Source
        uses: actions/checkout@v6
        with:
          repository: 'AlisterT/OpenJazz'
          path: source

      - name: Check if build needed
        id: check
        run: |
          git -C base   log --since='1 day ago' --oneline >  .new-commits
          git -C source log --since='1 day ago' --oneline >> .new-commits
          echo "new=$(wc -l < .new-commits)" >> $GITHUB_OUTPUT
          rm .new-commits
    outputs:
      new: ${{ steps.check.outputs.new }}

  build:
    needs: check
    runs-on: ubuntu-latest
    if: needs.check.outputs.new != '0'
    steps:
      - name: Install dependencies
        run: |
          sudo apt-get update -yqq
          sudo apt-get install -yqq build-essential cmake ninja-build \
            doxygen graphviz fonts-freefont-ttf

      - name: Setup emsdk
        uses: mymindstorm/setup-emsdk@v14

      - name: Checkout Source
        uses: actions/checkout@v6
        with:
          repository: 'AlisterT/OpenJazz'

      - name: Build with emscripten
        run: |
          emcmake cmake -B build-web . -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DDATAPATH=/data -DNETWORK=OFF
          cmake --build build-web

      - name: Upload WASM artifact
        uses: actions/upload-artifact@v7
        with:
          name: build-web
          path: |
            build-web/*.js
            build-web/*.wasm
            build-web/*.html

      - name: Build Doxygen documentation
        run: cmake --build build-web --target doc

      - name: Upload DOXYGEN artifact
        uses: actions/upload-artifact@v7
        with:
          name: build-doxygen
          path: build-web/doc/html/

  site:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Base Site
        uses: actions/checkout@v6
        with:
          path: base

      - name: Download artifacts
        uses: actions/download-artifact@v7

      - name: Prepare site
        run: |
          mkdir -p _site
          # disable jekyll
          touch _site/.nojekyll
          # web port
          mv build-web/*.{js,wasm} _site # engine
          mv base/* _site # data
          # duplicate web page
          for version in shareware holiday-hare holiday-hare95; do
            sed "s/data.js/${version}.js/" build-web/OpenJazz.html > _site/$version.html
          done
          ln -s shareware.html _site/index.html # make shareware default
          # move doxygen in place
          mv build-doxygen _site/doc

      - name: Upload artifact to GitHub pages
        uses: actions/upload-pages-artifact@v4

  deploy:
    needs: site
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
